[package]
name = "fim"
version = "0.1.0"
edition = "2021"

[dependencies]
diesel = { version = "2.2.0", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] } # or `mysql` or `sqlite`
diesel_migrations = "2.2.0"
dotenvy = "0.15"
dotenvy_macro = "0.15.1"
rand = "0.8"
clap = { version = "4.5.19", features = ["derive"] }
anyhow = "1.0.89"
indicatif = "0.17.8"
log = "0.4.22"
env_logger = "0.11.5"
chrono = "0.4.38"
openai = "1.0.0-alpha.16"
tokio = { version = "1.40.0", features = ["fs"] }
textwrap = "0.16.1"
sqlx = { version = "0.8.2", features = ["sqlite", "runtime-tokio", "uuid"] }
uuid = { version = "1.3", features = ["v4"] }
futures = "0.3.31"

[dev-dependencies]
predicates = "3.1.2"
assert_cmd = "2.0.14"
lazy_static = "1.5.0"

[lib]
doc = false

[profile.release]
opt-level = "z" # Opt-level "z" reduces size; for max speed, use "s" or numbers 0 to 3
lto = true      # Link Time Optimization, further reduces size and/or improvers speed
codegen-units = 1 # Reduces number of codegen units to improve runtime performance at the cost of longer compilation time
